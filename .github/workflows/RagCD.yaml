name: RAG CD Worlflow

on:
  workflow_run:
    workflows: ["RAG CI Workkflow"]
    types: ["completed"]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-2
  ECR_API_REPOSITORY: ops-rag-api
  ECR_FRONTEND_REPOSITORY: ops-rag-frontend
  DEPLOY_BUCKET: rag-app-s3-bucket
  CODEDEPLOY_APP: rag-ops
  CODEDEPLOY_GROUP: rag-ops-dg

jobs:
  build-and-push:
    name: deploy images to ECR
    runs-on: ubuntu-latest
    if: github.event_name=='workflow_dispatch' || github.event.worflow_run.conclusion == 'success'
    timeout-minutes: 30
    steps:
      - name: checkout_repository
        uses: actions/checkout@v7
        with:
          ref: ${{github.event.workflow_run.head_sha || github.sha}}

      - name: configure aws creds
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{env.AWS_REGION}}

      - name: aws ecr login
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: check-repo-exists
        run: |
          for repo in "$ECR_API_REPOSITORY" "$ECR_FRONTEND_REPOSITORY"; do
            aws ecr describe-repositories --repository-names "$repo" --region "$AWS_REGION" >/dev/null 2>&1 \
              || aws ecr create-repository --repository-name "$repo" --region "$AWS_REGION"
          done

      - name: setup-docker
        uses: docker/setup-buildx-action@v4

      - name: name image tag
        id: vars
        run: echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"

      - name: push api image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          secrets: |
            openai_api_key=${{secrets.OPENAI_API_KEY}}
          tags: |
            ${{steps.ecr-login.outputs.registry}}/${{env.ECR_API_REPOSITORY}}:${{steps.vars.outputs.sha}}
            ${{steps.ecr-login.outputs.registry}}/${{env.ECR_API_REPOSITORY}}:latest

      - name: push frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: true
          tags: |
            ${{steps.ecr-login.outputs.registry}}/${{env.ECR_FRONTEND_REPOSITORY}}:${{steps.vars.outputs.sha}}
            ${{steps.ecr-login.outputs.registry}}/${{env.ECR_FRONTEND_REPOSITORY}}:latest

  deploy-code-to-aws:
    name: Roll out to EC2 via CodeDeploy
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the promoted commit
        uses: actions/checkout@v7 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6 # v6.2.4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Assemble the CodeDeploy revision bundle
        run: |
          set -euo pipefail
          mkdir -p bundle/scripts
          cp deployment/appspec.yaml bundle/
          cp deployment/docker-compose.yaml bundle/
          cp deployment/scripts/*.sh bundle/scripts/
          chmod +x bundle/scripts/*.sh

      - name: Upload the revision to S3
        id: rev
        run: |
          set -euo pipefail
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          KEY="Rag-Ops/${SHA}.zip"
          ( cd bundle && zip -qr ../revision.zip . )
          aws s3 cp revision.zip "s3://${DEPLOY_BUCKET}/${KEY}"
          echo "key=${KEY}" >> "$GITHUB_OUTPUT"

      - name: Create the deployment
        run: |
          set -euo pipefail
          DEPLOYMENT_ID=$(aws deploy create-deployment \
            --application-name "$CODEDEPLOY_APP" \
            --deployment-group-name "$CODEDEPLOY_GROUP" \
            --deployment-config-name CodeDeployDefault.OneAtATime \
            --s3-location "bucket=${DEPLOY_BUCKET},key=${{ steps.rev.outputs.key }},bundleType=zip" \
            --file-exists-behavior OVERWRITE \
            --description "CD ${{ github.event.workflow_run.head_sha || github.sha }}" \
            --query deploymentId --output text)
          echo "Deployment $DEPLOYMENT_ID"
          echo "https://console.aws.amazon.com/codesuite/codedeploy/deployments/${DEPLOYMENT_ID}?region=${AWS_REGION}"
