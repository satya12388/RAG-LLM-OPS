version: 0.0
os: linux

files:
  - source: docker-compose.yaml
    destination: /opt/Rag-Ops

file_exists_behavior: OVERWRITE

permissions:
  - object: /opt/Rag-Ops/docker-compose.yml
    owner: ubuntu
    group: ubuntu
    mode: "644"

hooks:
  ApplicationStop:
    - location: scripts/application_stop.sh
      timeout: 120
      runas: root
  BeforeInstall:
    - location: scripts/before_install.sh
      timeout: 600
      runas: root
  ApplicationStart:
    - location: scripts/application_start.sh
      timeout: 300
      runas: root
  ValidateService:
    - location: scripts/validate_service.sh
      timeout: 600
      runas: root
