services:
  api:
    image: 433306737796.dkr.ecr.ap-southeast-2.amazonaws.com/ops-rag-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    
  frontend:
    image: 433306737796.dkr.ecr.ap-southeast-2.amazonaws.com/ops-rag-frontend
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - BACKEND_API_URL=http://api:8000
      - SESSIONS_FILE_PATH=/RAGFrontend/sessions/frontend_session.json
    volumes:
      - frontend_session:/RAGFrontend/sessions
    depends_on:
      - api

volumes:
  frontend_session:
    